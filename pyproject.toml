[project]
name = "netsentinel-ml"
version = "0.1.0"
description = "Network intrusion detection with MLOps, drift detection, and explainability."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "pandas>=2.2,<3.0",
  "numpy>=2.0,<3.0",
  "scikit-learn>=1.5,<2.0",
  "scipy>=1.13,<2.0",
  "joblib>=1.4,<2.0",
  "prometheus-client>=0.20,<1.0",
  "streamlit>=1.40,<2.0",
  "plotly>=5.20,<6.0",
  "requests>=2.32,<3.0",
  "pyarrow>=16.0,<21.0",
]

[project.optional-dependencies]
mlops = [
  "mlflow>=2.14,<3.0",
  "optuna>=3.6,<5.0",
  "shap>=0.46,<1.0",
  "xgboost>=2.1,<4.0",
  "slowapi>=0.1,<1.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "httpx>=0.27,<1.0",
  "black>=24.0,<26.0",
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"dashboard/app.py" = ["E402"]
