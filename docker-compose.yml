services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      NETSENTINEL_ENVIRONMENT: development
      NETSENTINEL_API_KEY: dev-netsentinel-key
      NETSENTINEL_DEMO_TRAINING_ROWS: 900
    volumes:
      - ./models:/app/models
      - ./data:/app/data

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      NETSENTINEL_API_KEY: dev-netsentinel-key
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
